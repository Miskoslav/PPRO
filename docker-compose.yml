# ==============================================================================
# Docker Compose konfigurace pro Skladový systém Dřevěnka s.r.o.
# Projekt předmětu Pokročilé programování (PPRO) - FIM UHK
# ==============================================================================
# Spuštění celého prostředí:
#   docker compose up -d
#
# Zastavení:
#   docker compose down
# ==============================================================================

services:
  # Databázová služba: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: drevenka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevenka_warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d drevenka_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplikační backend: Spring Boot 3 + webové rozhraní
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drevenka-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/drevenka_warehouse
      SPRING_DATASOURCE_USERNAME: warehouse_user
      SPRING_DATASOURCE_PASSWORD: warehouse_secret_password
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    name: drevenka_postgres_data

