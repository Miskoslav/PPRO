# ==============================================================================
# Docker Compose konfigurace pro Skladový systém Dřevěnka s.r.o.
# Projekt předmětu Pokročilé programování (PPRO) - FIM UHK (ZS 2026/2027)
# ==============================================================================
# Jednoduché spuštění celého prostředí jediným příkazem:
#   docker compose up -d --build
#
# Zastavení a úklid:
#   docker compose down
#
# Zastavení včetně smazání databáze (čistý start):
#   docker compose down -v
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Relační databáze: PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: drevenka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevenka_warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d drevenka_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - drevenka-network

  # ----------------------------------------------------------------------------
  # 2. Aplikační backend: Spring Boot 3 + REST API + SPA Webové UI
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drevenka-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/drevenka_warehouse
      SPRING_DATASOURCE_USERNAME: warehouse_user
      SPRING_DATASOURCE_PASSWORD: warehouse_secret_password
      # JVM nastavení
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - drevenka-network

# ------------------------------------------------------------------------------
# Perzistentní úložiště pro PostgreSQL databázi
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: drevenka_postgres_data

# ------------------------------------------------------------------------------
# Izolovaná síť pro bezpečné propojení služeb
# ------------------------------------------------------------------------------
networks:
  drevenka-network:
    name: drevenka-network
    driver: bridge
